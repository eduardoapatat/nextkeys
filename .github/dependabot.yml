# Minor and patch updates come grouped per ecosystem; each major update gets its own pull request.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "composer"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      api-composer:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/api"
    ignore:
      # vue-tsc/Volar and typescript-eslint do not support TypeScript 7 yet (AGENTS.md, Known pitfalls).
      - dependency-name: "typescript"
        versions: [">=6"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      api-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    ignore:
      # vue-tsc/Volar and typescript-eslint do not support TypeScript 7 yet (AGENTS.md, Known pitfalls).
      - dependency-name: "typescript"
        versions: [">=6"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      web-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
