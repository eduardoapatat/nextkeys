version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      api-composer:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      api-npm:
        patterns:
          - "*"
