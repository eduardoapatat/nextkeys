name: nextkeys

# Servicios de desarrollo. Las apps corren en local (php artisan / pnpm dev).

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nextkeys
      POSTGRES_USER: nextkeys
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextkeys -d nextkeys"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web: http://localhost:8025

volumes:
  postgres-data:
  redis-data:
